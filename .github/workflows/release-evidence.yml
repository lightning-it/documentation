# yamllint disable rule:truthy
---
name: Release Evidence

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    name: Build release evidence
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Activate the pinned npm release
        run: npm install --global --no-audit --no-fund npm@11.18.0 && test "$(npm --version)" = "11.18.0"

      - name: Install locked dependencies
        run: npm ci

      - name: Install pinned Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Repeat required validation
        run: npm run validate:release

      - name: Archive release artifact
        run: tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -czf documentation-build.tgz build

      - name: Generate release manifest
        run: node scripts/generate-release-evidence.mjs

      - name: Retain release artifact, SBOM, and manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation-release-${{ github.sha }}
          path: |
            documentation-build.tgz
            evidence/generated/sbom.cdx.json
            evidence/generated/sbom-production.cdx.json
            evidence/generated/release-manifest.json
          if-no-files-found: error
          retention-days: 90

  deploy:
    name: Deploy immutable artifact to Cloudflare Pages
    needs: [evidence, attest]
    if: github.repository == 'lightning-it/documentation' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    environment: production
    concurrency:
      group: cloudflare-pages-production
      cancel-in-progress: false
    steps:
      - name: Checkout deployment definition
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Activate the pinned npm release
        run: npm install --global --no-audit --no-fund npm@11.18.0 && test "$(npm --version)" = "11.18.0"

      - name: Download validated release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: documentation-release-${{ github.sha }}
          path: .

      - name: Verify and extract immutable release artifact
        run: |
          set -euo pipefail
          recorded_commit="$(node -p "require('./evidence/generated/release-manifest.json').productionCommit")"
          expected_digest="$(node -p "require('./evidence/generated/release-manifest.json').artifact.sha256")"
          actual_digest="$(sha256sum documentation-build.tgz | cut -d ' ' -f 1)"
          if [[ "$recorded_commit" != "$GITHUB_SHA" ]]; then
            echo "::error::Release manifest commit does not match the workflow commit."
            exit 1
          fi
          if [[ "$actual_digest" != "$expected_digest" ]]; then
            echo "::error::Release artifact digest does not match the retained manifest."
            exit 1
          fi
          while IFS= read -r entry; do
            if [[ "$entry" == /* || "$entry" == ".." || "$entry" == ../* || "$entry" == */../* || "$entry" == */.. ]]; then
              echo "::error::Release artifact contains an unsafe path: $entry"
              exit 1
            fi
            case "$entry" in
              build | build/ | build/*) ;;
              *)
                echo "::error::Release artifact contains content outside build/: $entry"
                exit 1
                ;;
            esac
          done < <(tar --list --gzip --file documentation-build.tgz)
          if tar --list --verbose --gzip --file documentation-build.tgz |
            awk 'substr($1, 1, 1) == "l" || substr($1, 1, 1) == "h" { found=1 } END { exit found ? 0 : 1 }'
          then
            echo "::error::Release artifact contains a symbolic or hard link."
            exit 1
          fi
          tar --extract --gzip --no-same-owner --no-same-permissions --no-overwrite-dir --file documentation-build.tgz

      - name: Deploy retained artifact without rebuilding
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          wranglerVersion: 4.114.0
          command: >-
            pages deploy build
            --project-name lightning-it-documentation
            --branch main
            --commit-hash "${{ github.sha }}"
            --commit-dirty=false

  attest:
    name: Attest immutable release artifact
    needs: evidence
    if: github.repository == 'lightning-it/documentation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Download unprivileged release output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: documentation-release-${{ github.sha }}

      - name: Attest release artifact
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: documentation-build.tgz
