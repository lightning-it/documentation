# yamllint disable rule:truthy
---
name: Production Rollback

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Release Evidence run containing the retained artifact
        required: true
        type: string
      release_commit:
        description: Full commit ID recorded in the retained release manifest
        required: true
        type: string
      operation:
        description: Auditable reason for the deployment
        required: true
        type: choice
        options:
          - rollback
          - restore

permissions:
  actions: read
  attestations: read
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy-and-verify:
    name: ${{ inputs.operation }} / production
    if: github.repository == 'lightning-it/documentation' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      BASE_URL: https://docs.l-it.io
      PRODUCTION_CONTENT_BASE_URL: https://lightning-it-documentation.pages.dev
      EXPECTED_COMMIT: ${{ inputs.release_commit }}
      PRODUCTION_POLL_MAX_ATTEMPTS: 90

    steps:
      - name: Validate immutable release coordinates
        env:
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "::error::release_run_id must be a numeric GitHub Actions run ID."
            exit 1
          }
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::release_commit must be a full lowercase commit ID."
            exit 1
          }
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_RUN_ID}")"
          jq -e \
            --arg commit "$RELEASE_COMMIT" \
            '(.path == ".github/workflows/release-evidence.yml")
             and (.conclusion == "success")
             and (.head_branch == "main")
             and (.head_sha == $commit)' \
            <<<"$run_json" >/dev/null || {
              echo "::error::Run ID is not a successful main Release Evidence run for release_commit."
              exit 1
            }

      - name: Checkout acceptance code from retained release
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.release_commit }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Activate the pinned npm release
        run: npm install --global --no-audit --no-fund npm@11.18.0 && test "$(npm --version)" = "11.18.0"

      - name: Install locked dependencies
        run: npm ci

      - name: Download retained release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: documentation-release-${{ inputs.release_commit }}
          path: retained-release
          repository: lightning-it/documentation
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}

      - name: Verify and extract immutable release artifact
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          manifest="retained-release/evidence/generated/release-manifest.json"
          recorded_commit="$(node -p "require('./${manifest}').productionCommit")"
          expected_digest="$(node -p "require('./${manifest}').artifact.sha256")"
          actual_digest="$(sha256sum retained-release/documentation-build.tgz | cut -d ' ' -f 1)"
          [[ "$recorded_commit" == "$RELEASE_COMMIT" ]] || {
            echo "::error::Release manifest commit does not match the requested commit."
            exit 1
          }
          [[ "$actual_digest" == "$expected_digest" ]] || {
            echo "::error::Release artifact digest does not match the retained manifest."
            exit 1
          }
          gh attestation verify retained-release/documentation-build.tgz \
            --repo lightning-it/documentation \
            --signer-workflow lightning-it/documentation/.github/workflows/release-evidence.yml \
            --source-digest "$RELEASE_COMMIT" \
            --source-ref refs/heads/main
          while IFS= read -r entry; do
            if [[ "$entry" == /* || "$entry" == ".." || "$entry" == ../* || "$entry" == */../* || "$entry" == */.. ]]; then
              echo "::error::Release artifact contains an unsafe path: $entry"
              exit 1
            fi
            case "$entry" in
              build | build/ | build/*) ;;
              *)
                echo "::error::Release artifact contains content outside build/: $entry"
                exit 1
                ;;
            esac
          done < <(tar --list --gzip --file retained-release/documentation-build.tgz)
          if tar --list --verbose --gzip --file retained-release/documentation-build.tgz |
            awk 'substr($1, 1, 1) == "l" || substr($1, 1, 1) == "h" { found=1 } END { exit found ? 0 : 1 }'
          then
            echo "::error::Release artifact contains a symbolic or hard link."
            exit 1
          fi
          tar --extract --gzip --no-same-owner --no-same-permissions --no-overwrite-dir --file retained-release/documentation-build.tgz

      - name: Deploy retained artifact without rebuilding
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          wranglerVersion: 4.114.0
          command: >-
            pages deploy build
            --project-name lightning-it-documentation
            --branch main
            --commit-hash "${{ inputs.release_commit }}"
            --commit-dirty=false

      - name: Wait for requested immutable deployment
        run: npm run wait:production

      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Validate production after deployment
        run: npm run test:production

      - name: Validate public external links
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run test:external-links

      - name: Enforce production Lighthouse budgets
        env:
          LIGHTHOUSE_BASE_URL: ${{ env.PRODUCTION_CONTENT_BASE_URL }}
          LIGHTHOUSE_CANONICAL_ORIGIN: ${{ env.BASE_URL }}
        run: npm run test:lighthouse

      - name: Record production evidence
        run: npm run evidence:production

      - name: Upload rollback or restoration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-${{ inputs.operation }}-${{ inputs.release_commit }}
          path: |
            retained-release/evidence/generated/release-manifest.json
            evidence/generated/
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 90
