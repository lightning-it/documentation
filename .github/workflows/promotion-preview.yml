# yamllint disable rule:truthy
---
name: Promotion Preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: promotion-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: preview / required
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: preview
    env:
      BASE_URL: https://develop.lightning-it-documentation.pages.dev/
      PREVIEW_URL: https://develop.lightning-it-documentation.pages.dev/
      EXPECTED_PREVIEW_COMMIT: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Enforce protected develop-to-main promotion
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          test "$HEAD_REF" = "develop"
          test "$HEAD_REPOSITORY" = "$GITHUB_REPOSITORY"

      - name: Checkout reviewed promotion commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Activate the pinned npm release
        run: npm install --global --no-audit --no-fund npm@11.18.0 && test "$(npm --version)" = "11.18.0"

      - name: Install locked dependencies
        run: npm ci

      - name: Build exact reviewed preview candidate
        run: npm run build

      - name: Deploy exact candidate through the preview environment
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          wranglerVersion: 4.114.0
          command: >-
            pages deploy build
            --project-name lightning-it-documentation
            --branch develop
            --commit-hash "${{ github.event.pull_request.head.sha }}"
            --commit-dirty=false

      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Validate exact-commit preview, search, headers, and accessibility
        run: npm run test:preview

      - name: Upload immutable preview acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promotion-preview-${{ github.event.pull_request.head.sha }}
          path: |
            evidence/generated/preview-validation.json
            evidence/generated/preview-playwright.json
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 90
